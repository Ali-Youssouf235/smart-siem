version: "3.9"

networks:
  siem-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local

services:
  # --- APPS (Le code d'Ali) ---
  backend:
    build: ./backend
    container_name: smart-siem-backend
    ports:
      - "8000:8000"
    networks:
      - siem-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smart-siem-frontend
    ports:
      - "3000:3000"
    networks:
      - siem-network
    depends_on:
      - backend
    restart: unless-stopped

  # --- INFRASTRUCTURE LOGS (Ton travail pour débloquer Mahel) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: siem-elasticsearch
    environment:
    - node.name=siem-node
    - cluster.name=siem-cluster
    - discovery.type=single-node
    - ELASTIC_PASSWORD=siem2026
    - xpack.security.enabled=true
    - xpack.security.http.ssl.enabled=true
    - xpack.security.http.ssl.keystore.path=certs/es.p12
    - xpack.security.transport.ssl.enabled=true
    - xpack.security.transport.ssl.keystore.path=certs/es.p12
    - xpack.security.transport.ssl.truststore.path=certs/es.p12
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs
    ports:
      - "9200:9200"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:siem2026", "https://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: siem-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/siem:ro
    networks:
      - siem-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: siem-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbjpJS2VtTFFablFpQzViZGxaVGNfakZ
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca.crt
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./certs:/usr/share/kibana/config/certs
    networks:
      - siem-network