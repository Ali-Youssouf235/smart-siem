version: "3.9"

networks:
  siem-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local

services:
  # --- APPS (Le code d'Ali) ---
  backend:
    build: ./backend
    container_name: smart-siem-backend
    ports:
      - "8000:8000"
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - siem-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smart-siem-frontend
    ports:
      - "3000:3000"
    networks:
      - siem-network
    depends_on:
      - backend
    restart: unless-stopped

  # --- INFRASTRUCTURE LOGS (Ton travail pour débloquer Mahel) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: siem-elasticsearch
    environment:
      - node.name=${ELASTIC_NODE_NAME}
      - cluster.name=${ELASTIC_CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:siem2026", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: siem-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/siem:ro
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: siem-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_ACCOUNT_TOKEN}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - siem-network