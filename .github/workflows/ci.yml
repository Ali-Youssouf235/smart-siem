name: CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Python (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lancement du lint flake8
        run: |
          cd backend
          flake8 app/ --statistics

  build-and-push:
    name: Build et Push des images Docker
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Convertir le nom du owner en minuscules
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: | 
            ghcr.io/${{ steps.owner.outputs.name }}/smart-siem-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/smart-siem-backend:${{ github.sha }}

      - name: Build et push image frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: | 
            ghcr.io/${{ steps.owner.outputs.name }}/smart-siem-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/smart-siem-frontend:${{ github.sha }}

  security-scan:
    name: Scan sécurité des images (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Convertir le nom du owner en minuscules
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Scan de l'image backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/smart-siem-backend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH